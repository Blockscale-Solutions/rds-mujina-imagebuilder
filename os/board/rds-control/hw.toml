# The RDS control board's FPGA-side blocks: the one home for their addresses,
# sizes and interrupts (#42). tools/hw2dts generates the device-tree include
# from this file and checks it: no overlaps, provenance on every fact, and a
# MEASURED interrupt must equal the stock kernel's GIC hwirq minus 32.
# Access: uio (driven from userspace, #14), mainline (a mainline driver, D4),
# none (address reserved, no node). The bitstream decides all of this; the
# unit's own bitstream is the only one we run.
# Provenance: MEASURED names our capture of the stock unit (u: is our unit
# capture directory, which is not public). A value no capture has measured yet
# carries the vendor-derived tag and names the pass that will measure it; while
# any does, tools/publish-seed keeps this repository from a public seed.

[[block]]
name = "chain-uart0"
kind = "chain-uart"
base = 0xc0050000
size = 0x200
access = "uio"
reg_source = "MEASURED: stock boot log mapbase, u:inventory/20260915T014110Z/logs.txt"
spi = 41
trigger = "level-high"
irq_source = "MEASURED: stock /proc/interrupts, u:inventory/20260915T014110Z/system.txt"
stock_hwirq = 73
note = "all three share one 4 KiB page (DERIVED from the measured bases). Receive depth and DMA use are UNMEASURED, so tools/uart-budget reports them rather than assume them (#27): three PL330 channels (GIC hwirq 136, 138, 140) took about 9,230 interrupts each in a capture made while mining, u:inventory/20260915T014110Z/system.txt, and none where the chain ports had not been opened, u:inventory/kernel-20260924/unit-kernel-facts.txt; which transfers they carried is not measured"

